name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint
        # Solo si tienes eslint configurado. Si no, comenta esta línea.

      - name: Compile TypeScript
        run: npm run compile

      - name: Check Package
        run: npx @vscode/vsce package --out test.vsix
        # Esto verifica que la extensión se puede empaquetar sin errores.